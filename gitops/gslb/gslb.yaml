apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: podinfo
  namespace: podinfo
spec:
  resourceRef:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: podinfo
  strategy:
    # Demo value, so a drain shows up quickly. Production TTLs are longer and
    # so are drains: see "Known limits" in the README.
    dnsTtlSeconds: 5
    # type / primaryGeoTag: come from rotation.yaml
