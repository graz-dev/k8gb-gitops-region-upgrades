# The demo's entry point: the Gateway API Gateway the HTTPRoute attaches to. Istio (installed by
# k8gb's local setup, which we do not touch) implements it and creates a gateway Deployment and a
# LoadBalancer Service for it; k3d maps port 8000. It lives in the namespace k8gb's setup creates.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gatewayapi
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
