apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# System Upgrade Controller (the upstream way to upgrade k3s in place, declared as Plan
# resources) and this region's desired Kubernetes version. Kargo changes the version in
# the two Plans; Argo CD applies them; the controller upgrades the nodes.
resources:
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.1/crd.yaml
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.1/system-upgrade-controller.yaml
  - plan-server.yaml
  - plan-agent.yaml
patches:
  # CRD before anything that uses it, Plans after the controller is there
  - target: {kind: CustomResourceDefinition, name: plans.upgrade.cattle.io}
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "-2"}
  - target: {kind: Plan}
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "1"}
